<svg xmlns="http://www.w3.org/2000/svg" width="490" height="320" viewBox="0 0 490 320" style="background:#0d1117">
<defs>
  <style>
    .t { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 14px; }
    .title { font-weight: bold; font-size: 16px; fill: #58a6ff; }
    .key { fill: #3fb950; font-weight: bold; }
    .val { fill: #c9d1d9; }
    .sep { fill: #d29922; }
  </style>
</defs>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.00s" dur="0.4s" fill="freeze" />
    <text x="20" y="30" class="t title">veeeeee-coder@github</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.15s" dur="0.4s" fill="freeze" />
    <text x="20" y="58" class="t sep">────────────────────────────────</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.30s" dur="0.4s" fill="freeze" />
    <text x="20" y="86" class="t key">Role:</text>
    <text x="140" y="86" class="t val">Developer</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.45s" dur="0.4s" fill="freeze" />
    <text x="20" y="114" class="t key">Prev:</text>
    <text x="140" y="114" class="t val">Open Source Contributor</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.60s" dur="0.4s" fill="freeze" />
    <text x="20" y="142" class="t key">Stack:</text>
    <text x="140" y="142" class="t val">Python, JavaScript, React</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.4s" fill="freeze" /><animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="0.75s" dur="0.4s" fill="freeze" />
    <text x="20" y="170" class="t key">Highlights:</text>
    <text x="140" y="170" class="t val">Building cool things daily</text>
  </g>
</svg>